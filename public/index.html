<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
    .msg { margin: 5px 0; padding: 6px 10px; background: #eef; border-radius: 8px; }
    #inputRow { display: flex; margin-top: 10px; }
    #input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h2>Chat</h2>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="input" placeholder="Type a message..." />
    <button onclick="send()">Send</button>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');

  // Automatically connect to the same host that served this page
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}`);

  ws.onmessage = e => {
    const div = document.createElement('div');
    div.className = 'msg';
    div.textContent = e.data;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  function send() {
    const text = inputEl.value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(text);
    inputEl.value = '';
  }

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
